<h1>Now its time to fill out the pick up information! </h1>

<p>
         <form action="#" method="GET">
             <div class="form-row"></div>
                 <label for="first-name">
                    First Name:
                </label>
                <input type="text" name="First Name">
            <button type="submit">Send</button></div>
        
         </form>

         <form action="#" method="GET">
             <label for="last-name">
            Last Name:
            <input type="text" name="Last Name">
            <button type="submit">Send</button>
             </label>

         </form>
        <form action="#" method="GET">
            Email:
            <label for="Email">
                <input type="email" name="Email">
                <button type="submit">Send</button>

            </label>
            
        </form>
        <form>
              <div class="form-row">
            <label for="Phone Number:" aria-required="true">
                Phone number:
            </label>
                <input type="phone" name="Phone Number">
            <button type="submit"> Send</button>
            </div>
        </form>
 
  
        <form action="#" method="GET">
             <label for="comment">
                Comment:
                <textarea name="comment" cols="32" rows="10"></textarea>
                <button type="submit">Send</button>
            </label>
         
         </form>
  
</p>
